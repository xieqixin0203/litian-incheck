<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>材料造价库</title>
<script>
(function(){
  try{
    var f=localStorage.getItem('studio_fontsize_v2')||'medium';
    var t=localStorage.getItem('studio_theme')||'dark';
    document.documentElement.setAttribute('data-fontsize',f);
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.21/vue.global.prod.js"></script>
<style>
[v-cloak]{display:none !important}
html{font-size:16px}
html[data-fontsize="small"]{font-size:16px}
html[data-fontsize="medium"]{font-size:20px}
html[data-fontsize="large"]{font-size:24px}

:root,[data-theme="light"]{
  --bg:#eef1f6; --text:#2d3748; --card:#fff; --primary:#7b8bb8; --border:#d8dee9;
  --btn-secondary:#6b7280; --btn-dark:#1f2937;
}
[data-theme="dark"]{
  --bg:#1a1f2e; --text:#e8ecf4; --card:#252b3d; --primary:#8fa3c8; --border:#3a4258;
  --btn-secondary:#4a5568; --btn-dark:#0f1320;
}
[data-theme="green"]{
  --bg:#F7F4D5; --text:#0A3323; --card:#FFFFFF; --primary:#839958; --border:#D4CFAE;
  --btn-secondary:#839958; --btn-dark:#0A3323;
}
[data-theme="fresh"]{
  --bg:#F8EBE8; --text:#5A3735; --card:#FFFFFF; --primary:#B77D77; --border:#E5C7C2;
  --btn-secondary:#9E544A; --btn-dark:#5A3735;
}

*{box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);margin:0;padding:12px;transition:.3s}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px}
select,input,textarea{background:transparent;color:var(--text);font-size:13px}
.dark select,.dark input,.dark textarea{background-color:#252b3d}
.btn-export{background:var(--primary);color:#fff}
.btn-import{background:var(--btn-secondary);color:#fff}
.btn-home{background:var(--btn-dark);color:#fff}
.btn-edit{background:var(--primary);color:#fff}
.btn-sm{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
.btn-sm:hover{background:var(--bg)}
.btn-primary{font-size:12px;padding:6px 14px;border-radius:8px;background:var(--primary);color:#fff;border:none;cursor:pointer}
.cat-title{font-size:16px;font-weight:bold;padding:10px 16px;background:var(--primary);color:#fff;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.cat-body{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;overflow:hidden}
.mat-row{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px dashed var(--border);font-size:13px}
.mat-row:last-child{border-bottom:none}
.mat-name{font-weight:bold;flex-shrink:0;min-width:180px}
.mat-price{color:var(--primary);font-weight:bold;flex-shrink:0;min-width:130px}
.mat-note{opacity:.7;font-size:12px;flex:1}
.modal-mask{background:rgba(0,0,0,.5);position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;overflow-y:auto}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.form-label{font-size:12px;font-weight:bold;opacity:.7;margin-bottom:4px;display:block}
.form-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;background:transparent;color:var(--text)}
@media(max-width:768px){
  .mat-row{flex-direction:column;align-items:flex-start;gap:4px}
  .mat-name,.mat-price{min-width:0}
}
</style>
</head>
<body>
<div id="app" v-cloak class="max-w-5xl mx-auto">

<header class="mb-4 p-4 rounded-2xl shadow-sm" style="background:var(--card);border:1px solid var(--border)">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold" style="color:var(--primary)">📊 材料造价库</h1>
      <p class="text-xs mt-1 opacity-70">综合单价含人工、材料、辅材、管理费、税金；实际价格随地区、品牌、施工难度浮动，仅供方案阶段估算参考。</p>
    </div>
    <div class="flex gap-2 flex-wrap items-center">
      <button v-if="!isEditing" @click="isEditing=true" class="btn-edit px-3 py-1.5 rounded-lg text-xs">✎ 编辑模式</button>
      <button v-else @click="isEditing=false" class="btn-edit px-3 py-1.5 rounded-lg text-xs">✔ 完成编辑</button>
      <button @click="exportData" class="btn-export px-3 py-1.5 rounded-lg text-xs">导出</button>
      <button @click="importData" class="btn-import px-3 py-1.5 rounded-lg text-xs">导入</button>
      <a href="./index.html" class="btn-home px-3 py-1.5 rounded-lg text-xs">返回首页</a>
      <input ref="fileInput" type="file" accept=".json" class="hidden" @change="handleImport">
    </div>
  </div>
</header>

<div v-if="loading" class="card p-8 text-center opacity-60 text-sm">加载中…</div>

<div v-else class="space-y-4">
  <div v-for="cat in categories" :key="cat.key">
    <div class="cat-title">
      <span>{{ cat.label }}</span>
      <span class="text-xs opacity-80">{{ getItemsByCat(cat.key).length }} 条</span>
    </div>
    <div class="cat-body">
      <div v-if="getItemsByCat(cat.key).length === 0" class="p-4 text-xs opacity-50 text-center">暂无条目</div>
      <div v-for="item in getItemsByCat(cat.key)" :key="item.id" class="mat-row">
        <span class="mat-name">{{ item.name }}</span>
        <span class="mat-price">{{ item.price }}</span>
        <span class="mat-note">{{ item.note }}</span>
        <template v-if="isEditing">
          <button @click="editItem(item)" class="btn-sm">✎</button>
          <button @click="deleteItem(item)" class="btn-sm" style="color:#dc2626">🗑</button>
        </template>
      </div>
      <div v-if="isEditing" class="p-3 text-center">
        <button @click="openAdd(cat.key)" class="btn-sm" style="color:var(--primary)">+ 新增材料</button>
      </div>
    </div>
  </div>
</div>

<!-- 编辑/新增弹窗 -->
<div v-if="showItemModal" v-cloak class="modal-mask" @click.self="closeItemModal">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-4">{{ editingItemId ? '编辑材料' : '新增材料' }}</h3>
    <div class="mb-3">
      <label class="form-label">分类</label>
      <select v-model="draftItem.category" class="form-input">
        <option v-for="cat in categories" :key="cat.key" :value="cat.key">{{ cat.label }}</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">材料/做法名称</label>
      <input v-model="draftItem.name" class="form-input" placeholder="如：真石漆（普通）">
    </div>
    <div class="mb-3">
      <label class="form-label">综合单价</label>
      <input v-model="draftItem.price" class="form-input" placeholder="如：约59元/㎡">
    </div>
    <div class="mb-3">
      <label class="form-label">备注（可选）</label>
      <input v-model="draftItem.note" class="form-input" placeholder="如：含腻子、底漆、面漆、人工">
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="closeItemModal" class="btn-sm">取消</button>
      <button @click="saveItem" class="btn-primary">保存</button>
    </div>
  </div>
</div>

</div>

  {id:'m-123',category:'railing',name:'氟碳金属栏杆',price:'约300-620元/㎡',note:'常温氟碳喷涂钢制约301-380，不锈钢氟碳约616'}
];

createApp({
setup(){
  const loading=ref(true);
  const items=ref([]);
  const isEditing=ref(false);
  const showItemModal=ref(false);
  const editingItemId=ref(null);
  const draftItem=ref({category:'municipal',name:'',price:'',note:''});
  const fileInput=ref(null);

  const loadFromCloud=async()=>{
    try{
      const res=await fetch('/api/sync?type=materials&project=global');
      const data=await res.json();
      if(Array.isArray(data)&&data.length){
        items.value=data;
      }else{
        items.value=JSON.parse(JSON.stringify(seedData));
      }
    }catch(e){
      console.warn('材料库读取失败，使用默认数据',e);
      items.value=JSON.parse(JSON.stringify(seedData));
    }
    loading.value=false;
  };

  const saveToCloud=async()=>{
    try{
      await fetch('/api/sync?type=materials&project=global',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(items.value)
      });
    }catch(e){console.warn('材料库保存失败',e)}
  };

  const getItemsByCat=(cat)=>{
    return items.value.filter(i=>i.category===cat);
  };

  const openAdd=(cat)=>{
    draftItem.value={category:cat,name:'',price:'',note:''};
    editingItemId.value=null;
    showItemModal.value=true;
  };

  const editItem=(item)=>{
    draftItem.value={...item};
    editingItemId.value=item.id;
    showItemModal.value=true;
  };

  const closeItemModal=()=>{
    showItemModal.value=false;
    editingItemId.value=null;
  };

  const saveItem=()=>{
    if(!draftItem.value.name.trim()){alert('请填写材料名称');return}
    if(!draftItem.value.price.trim()){alert('请填写综合单价');return}
    if(editingItemId.value){
      const idx=items.value.findIndex(i=>i.id===editingItemId.value);
      if(idx>=0)items.value[idx]={...draftItem.value,id:editingItemId.value};
    }else{
      items.value.push({...draftItem.value,id:'m-'+Date.now()});
    }
    saveToCloud();
    closeItemModal();
  };

  const deleteItem=(item)=>{
    if(!confirm(`确定删除「${item.name}」？`))return;
    items.value=items.value.filter(i=>i.id!==item.id);
    saveToCloud();
  };

  const exportData=()=>{
    const blob=new Blob([JSON.stringify(items.value,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`材料造价库_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  };
  const importData=()=>{fileInput.value.click()};
  const handleImport=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(Array.isArray(data)){
          if(confirm('确认导入？将覆盖当前数据。')){
            items.value=data;
            saveToCloud();
          }
        }else{alert('文件格式不正确')}
      }catch(err){alert('导入失败：'+err.message)}
    };
    reader.readAsText(file);
  };

  onMounted(()=>{
    loadFromCloud();
  });

  return{
    loading,items,isEditing,
    categories,
    showItemModal,editingItemId,draftItem,
    getItemsByCat,openAdd,editItem,closeItemModal,saveItem,deleteItem,
    exportData,importData,handleImport,fileInput
  };
}
}).mount('#app');
</script>
</body>
</html>
